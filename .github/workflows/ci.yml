name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx jest --ci

      # Só avisa: uma falha nova no registro do npm não deve travar os PRs.
      # Sobra um aviso alto aceito (image-size dentro do Metro, só no build); ver Guara-vivo/documents#88.
      - name: Auditoria de dependências
        continue-on-error: true
        run: npm audit --audit-level=high
