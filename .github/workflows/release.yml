name: Release

# Entrega do APK: roda quando entra um merge na main (PR de release develop -> main).
# Só cria release se a versão for nova (tag vX.Y.Z ainda não existe). Merges na main
# sem mudança de versão (ex.: documentação) terminam no job "check" sem fazer build.
#
# Nunca dispare este workflow por pull_request: o job "build" usa o ambiente "release",
# que guarda a chave de assinatura e só aceita a branch main.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.info.outputs.version }}
      version_code: ${{ steps.info.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler a versão (falha se os 3 lugares divergirem)
        id: info
        run: bash .github/scripts/release-info.sh

      - name: Decidir se há release nova
        id: decide
        env:
          VERSION: ${{ steps.info.outputs.version }}
          VERSION_CODE: ${{ steps.info.outputs.version_code }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::notice::A tag v${VERSION} já existe: nada a entregar."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # O versionCode precisa ser maior que o da última tag, senão o Android recusa
          # a instalação por cima.
          prev_tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$prev_tag" ]; then
            prev_code=$(git show "${prev_tag}:android/app/build.gradle" \
              | sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' | head -1)
            echo "Última tag: ${prev_tag} (versionCode ${prev_code})"
            if [ -n "$prev_code" ] && [ "$VERSION_CODE" -le "$prev_code" ]; then
              echo "::error::versionCode ${VERSION_CODE} precisa ser maior que o da ${prev_tag} (${prev_code})."
              exit 1
            fi
          fi

          # Falha cedo se o CHANGELOG não tiver a seção da versão.
          bash .github/scripts/release-notes.sh "$VERSION" >/dev/null
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Os segredos ficam no ambiente "release" (Settings > Environments), restrito à
    # branch main. Não use segredos de repositório para a chave de assinatura.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      VERSION_CODE: ${{ needs.check.outputs.version_code }}
      # SHA-1 do certificado do app.keystore de release (público; não é segredo).
      EXPECTED_CERT_SHA1: 7A:75:BB:5A:57:3B:84:2A:B5:54:05:F2:62:3B:A4:1D:7F:23:6C:36
      EXPO_PUBLIC_API_URL: https://api.guaravivo.com.br
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci

      - name: Conferir typecheck, lint e testes
        run: |
          npm run typecheck
          npm run lint
          npx jest --ci

      - name: Montar o keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente no ambiente release."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/app.keystore

      - name: Gerar o APK de release
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          # Sem -PlocalDebugSign: assina com o app.keystore.
          ./gradlew assembleRelease --console=plain --no-daemon

      - name: Remover o keystore do runner
        if: always()
        run: rm -f android/app/app.keystore

      - name: Conferir assinatura, pacote e versão do APK
        run: |
          set -euo pipefail
          src=android/app/build/outputs/apk/release/app-release.apk
          test -f "$src" || { echo "::error::APK não encontrado em $src"; exit 1; }

          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          sig=$("$bt/apksigner" verify --print-certs "$src")
          echo "$sig"
          # Aceita "Signer #1 ..." e "Signer (minSdkVersion=...) ..."; vários signatários viram várias linhas.
          cert=$(echo "$sig" | sed -nE 's/^Signer .*certificate SHA-1 digest: (.*)$/\1/p' | tr -d ':\r' | tr 'A-F' 'a-f' | sort -u)
          expected=$(echo "$EXPECTED_CERT_SHA1" | tr -d ':' | tr 'A-F' 'a-f')
          echo "Certificado do APK: $cert"
          if [ "$cert" != "$expected" ]; then
            echo "::error::O APK não foi assinado com a chave de release (SHA-1 $cert, esperado $expected)."
            exit 1
          fi

          badging=$("$bt/aapt2" dump badging "$src" | head -1)
          echo "$badging"
          case "$badging" in
            *"name='com.guaravivo.app'"*"versionCode='${VERSION_CODE}'"*"versionName='${VERSION}'"*) ;;
            *) echo "::error::Pacote, versionCode ou versionName do APK não batem com ${VERSION} (${VERSION_CODE})."; exit 1 ;;
          esac

          out="guaravivo-${VERSION}-vc${VERSION_CODE}-release.apk"
          cp "$src" "$out"
          echo "APK_FILE=$out" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Montar as notas da release
        run: |
          {
            bash .github/scripts/release-notes.sh "$VERSION"
            echo
            echo "## Instalação"
            echo "- Pacote \`com.guaravivo.app\`, versão ${VERSION} (\`versionCode\` ${VERSION_CODE}). Instalar por cima de uma versão anterior mantém os dados; se a instalação falhar, desinstale a versão antiga e instale esta."
            echo "- Para conferir a versão instalada: Configurações > Apps > Guará Vivo."
            echo
            echo "## Verificação"
            echo "- SHA-256: \`${APK_SHA256}\`"
            echo "- Assinado com a chave de release (SHA-1 do certificado: \`${EXPECTED_CERT_SHA1}\`)."
            echo
            echo "Detalhes das versões no \`CHANGELOG.md\`."
          } > release-notes.md

      - name: Criar a tag e a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" "${APK_FILE}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
